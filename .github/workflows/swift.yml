name: Swift CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Swift
      uses: xcode-actions/setup-swift@v1
      with:
        swift-version: '5.9'

    - name: Build Package
      run: swift build -v

    - name: Run Tests
      run: swift test -v
